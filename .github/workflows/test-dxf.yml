name: DXF parser regression tests

on:
  push:
    branches: [main, redesign-v1]
  pull_request:
    branches: [main]

jobs:
  dxf-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run DXF parser tests
        run: node tests/dxf-parser.test.cjs
